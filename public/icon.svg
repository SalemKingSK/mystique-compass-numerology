<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF1B8" />
      <stop offset="50%" stop-color="#E8C56D" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="glow-eff" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background with slight rounding for PWA icon look -->
  <rect width="512" height="512" rx="100" fill="#000000" />
  <!-- Outer golden ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold-grad)" stroke-width="4" opacity="0.5" />
  <!-- Stylized Compass Rose from the logo -->
  <g transform="translate(256, 256) scale(4.5)" filter="url(#glow-eff)">
    <!-- Main points -->
    <path d="M 0 -40 L 10 0 L -10 0 Z" fill="#FDF1B8"/>
    <path d="M 0 40 L 10 0 L -10 0 Z" fill="#E8C56D"/>
    <path d="M 40 0 L 0 10 L 0 -10 Z" fill="#FDF1B8"/>
    <path d="M -40 0 L 0 10 L 0 -10 Z" fill="#E8C56D"/>
    <!-- Diagonal points -->
    <path d="M 28 -28 L 5 -5 L -5 5 Z" fill="#E8C56D" />
    <path d="M 28 28 L 5 5 L -5 -5 Z" fill="#FDF1B8" />
    <path d="M -28 28 L -5 5 L 5 -5 Z" fill="#E8C56D" />
    <path d="M -28 -28 L -5 -5 L 5 5 Z" fill="#FDF1B8" />
  </g>
</svg>